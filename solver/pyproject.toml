[project]
name = "tjenesteplan-solver"
version = "0.0.1"
description = "CP-SAT-planlegger for Tjenesteplan (spike)"
requires-python = ">=3.12"
dependencies = ["ortools>=9.12"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tjenesteplan_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
