[project]
name = "dutyplan-solver"
version = "0.0.1"
description = "CP-SAT planner for Dutyplan"
requires-python = ">=3.12"
dependencies = ["ortools>=9.12"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dutyplan_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default (cheap for an AI): one line on success, one line per failure, no third-party warnings.
addopts = "-q --tb=line -p no:cacheprovider --no-header -W ignore::DeprecationWarning"
