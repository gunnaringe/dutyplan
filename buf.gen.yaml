version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  # the page's client (web/src/gen, TypeScript; needs npm ci)
  - local: node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
