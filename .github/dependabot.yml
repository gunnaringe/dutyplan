# Weekly dependency updates: one grouped PR per ecosystem for minor/patch,
# majors as separate PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /solver
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    commit-message:
      prefix: deps
    ignore:
      # OR-Tools has no wheels for Python 3.15 yet (9.15 stops at 3.14). Remove this once it has, and bump mise.toml with it.
      - dependency-name: "*python"
        versions: [">=3.15"]
