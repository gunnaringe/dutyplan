# The checks of `mise run verify` (prek, tests, smoke test, mutations) plus the browser check, on every pull request and on main.
# The tools come from mise.toml (jdx/mise-action), the Python packages from solver/uv.lock.
# The mutations get a job of their own: the Python ones edit the planner in place while they run, so nothing else may use it then.
# On a pull request only the mutations of the files it changes run (and those it adds or changes), with every pattern checked to
# still exist; main runs them all (about 25 min), so a weakened test is still caught there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a new push to a pull request replaces its run; on main every merge gets its full run of the mutations
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: The page's build tools (package-lock.json; lint's gen and web hooks need them)
        run: mise exec -- npm ci --no-audit --no-fund
      - name: prek checks (YAML, JSON, TOML, gofmt, JS syntax, keys, big files)
        run: mise run lint
      - name: The API's generated code matches proto/ (buf lint, buf generate)
        run: mise run gen:check
      - name: The page type-checks and web/app.js matches web/src (tsc, esbuild)
        run: mise run web:check
      - name: Python packages
        run: mise run setup
      - name: Tests (Go and Python)
        run: mise run test
      - name: Smoke test of the app
        run: mise run app:smoke
      - name: Browser check (English and Norwegian)
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core
          CHROME: /usr/bin/google-chrome
        run: |
          mise exec -- npm install --silent --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.64.0
          mise run app:ui

  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the pull request's base, to see what it changed
      - uses: jdx/mise-action@v5
      - name: Python packages
        run: mise run setup
      - name: Every rule broken in turn must make a test fail
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then mise run mutations -- --changed-since "$BASE"; else mise run mutations; fi
