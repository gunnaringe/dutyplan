# Alle verktøy og kommandoer går gjennom mise. Ikke kjør python/uv/pytest/go direkte.
#   mise install      verktøyene (python, uv, go) i eksakte versjoner (under)
#   mise run setup    Python-pakkene (ortools, pytest) fra solver/uv.lock; Go-pakkene hentes av go selv
#   mise tasks        alle oppgaver
min_version = "2026.10.0"

[tools]
python = "3.12.15"
uv = "0.13.5"
go = "1.26.10"

[env]
# uv skal bruke mises Python og lockfila, aldri laste ned sin egen Python eller endre låsen på egen hånd.
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"
UV_LOCKED = "1"
UV_PROJECT_ENVIRONMENT = "{{config_root}}/solver/.venv"

[tasks.setup]
description = "Python-pakkene fra uv.lock (kjør etter mise install)"
quiet = true
dir = "{{config_root}}/solver"
run = "uv sync"

[tasks.test]
description = "Alle tester, Go og Python, stille (ca. 15 s). Ekstra args gjelder ikke; bruk test:app eller test:solver -- -k navn"
depends = ["test:app", "test:solver"]
quiet = true
run = "echo 'test: ok'"

[tasks."test:fast"]
description = "Raskeste løkke: Go-testene og Python-regeltestene (ca. 5 s)"
depends = ["test:app", "test:solver:fast"]
quiet = true
run = "echo 'test:fast: ok'"

[tasks."test:app"]
description = "go vet + go test for appen, stille (ca. 3 s). Args: -- -run Navn"
quiet = true
run = "sh scripts/test-app.sh"

[tasks."test:solver"]
description = "Python-testene for planleggeren, stille (ca. 10 s). Args: -- -k navn"
dir = "{{config_root}}/solver"
quiet = true
run = "uv run pytest"

[tasks."test:solver:fast"]
description = "Bare regeltestene i planleggeren (ca. 2 s)"
dir = "{{config_root}}/solver"
quiet = true
run = "uv run pytest tests/test_rules.py"

[tasks."app:build"]
description = "Bygg appen til bin/tjenesteplan (én statisk binær med frontenden innebygd)"
quiet = true
run = "go build -o bin/tjenesteplan ./cmd/tjenesteplan"

[tasks."app:run"]
description = "Kjør appen i forgrunnen. Skriver én linje med adressen. Args: -- --addr 127.0.0.1:8080 --db fil.db"
quiet = true
run = "go run ./cmd/tjenesteplan"

[tasks."app:ui"]
description = "Nettlesersjekk av frontenden (headless Chromium mot en midlertidig server, ca. 10 s). Krever playwright-core fra ../scoreboard"
depends = ["app:build"]
quiet = true
run = "node scripts/ui-check.js"

[tasks."app:seed"]
description = "Legg testdata inn i en kjørende app: organisasjonen «Test» med oppgavene Lovsang, Lyd og Bilde. Args: -- http://127.0.0.1:8080"
quiet = true
run = "sh scripts/seed-demo.sh"

[tasks."app:smoke"]
description = "Start appen på en midlertidig database, lag to organisasjoner, sjekk isolasjonen med curl, stopp den igjen (ca. 5 s)"
depends = ["app:build"]
quiet = true
run = "sh scripts/smoke.sh"

[tasks.mutations]
description = "Bryt hver regel i modellen og sjekk at en test feiler (ca. 30 s). Stille ved suksess. Args: --only tekst, --list"
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python scripts/mutations.py"

[tasks.verify]
description = "Tester (Go + Python) + mutasjoner + røyktest av appen: alt som må være grønt før commit"
depends = ["test", "mutations", "app:smoke"]
quiet = true
run = "echo 'verify: ok'"

[tasks.plan]
description = "Kjør planleggeren på testdataene og skriv en kort oppsummering (ca. 6 linjer). Args: --full, --info, --time N, --seed N, --input fil (sti fra repoets rot)"
quiet = true
run = "uv run --project solver python solver/scripts/plan.py"

[tasks.check]
description = "Uavhengig sjekk av en ferdig plan: mise run check -- inndata.json utdata.json (stier fra repoets rot)"
quiet = true
run = "uv run --project solver python -m tjenesteplan_solver check"

[tasks.solve]
description = "Planleggeren som filter: mise run solve < inndata.json > utdata.json"
quiet = true
run = "uv run --project solver python -m tjenesteplan_solver"

[tasks.fixture]
description = "Lag testdataene på nytt (solver/fixtures/host2026.json) fra make_host2026.py"
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python fixtures/make_host2026.py > fixtures/host2026.json"

[tasks."measure:time"]
description = "Kvalitet mot tidsgrense på testdataene (ca. 80 s)"
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python scripts/timing.py"

[tasks."measure:fair"]
description = "Sammenlign vektsett for jevn fordeling (ca. 100 s). Args: tidsgrense frø..."
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python scripts/fairness_experiment.py"

# Avhengigheter endres også via mise. UV_LOCKED=1 (over) forbyr det på vanlig kjøring, så disse slår det av.
[tasks.lock]
description = "Oppdater solver/uv.lock etter endring i pyproject.toml. Args: --upgrade for nyere versjoner"
quiet = true
dir = "{{config_root}}/solver"
env = { UV_LOCKED = "0" }
run = "uv lock"

[tasks.add]
description = "Legg til en Python-pakke: mise run add -- pakke  (eller -- --dev pakke). Oppdaterer pyproject.toml og uv.lock"
quiet = true
dir = "{{config_root}}/solver"
env = { UV_LOCKED = "0" }
run = "uv add"
