# All tools and commands go through mise. Do not run python/uv/pytest/go directly.
#   mise install      the tools (python, uv, go, node, prek) in exact versions (below)
#   prek install      the checks of prek.toml on every commit (once per clone)
#   mise run up       setup + build + start the app (a new database gets the demo organisation)
#   mise run setup    the Python packages (ortools, pytest) from solver/uv.lock; go fetches the Go packages itself
#   mise tasks        all tasks
min_version = "2026.10.0"

[tools]
python = "3.14.10"
uv = "0.13.9"
go = "1.27.4"
node = "26.13.1"  # the browser check and the README pictures (scripts/*.js)
prek = "0.5.11"  # git hooks and the same checks in CI (prek.toml)
buf = "1.73.0"  # the API in proto/ (mise run gen)
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.21.1"

[env]
# uv must use mise's Python and the lock file, never download a Python of its own or change the lock on its own.
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"
UV_LOCKED = "1"
UV_PROJECT_ENVIRONMENT = "{{config_root}}/solver/.venv"
# How the app starts the planner (split on spaces, no quotes). Needs mise run setup. The app reads it as --solver.
DUTYPLAN_SOLVER = "{{config_root}}/solver/.venv/bin/python -m dutyplan_solver"

[tasks.setup]
description = "The Python packages from uv.lock (run after mise install)"
quiet = true
dir = "{{config_root}}/solver"
run = "uv sync"

[tasks.test]
description = "All tests, Go and Python, quiet (about 15 s). Extra args do not apply; use test:app or test:solver -- -k name"
depends = ["test:app", "test:solver"]
quiet = true
run = "echo 'test: ok'"

[tasks."test:fast"]
description = "The quickest loop: the Go tests and the Python rule tests (about 5 s)"
depends = ["test:app", "test:solver:fast"]
quiet = true
run = "echo 'test:fast: ok'"

[tasks.lint]
description = "The prek checks on the whole tree (YAML, JSON, TOML, gofmt, JS syntax, no keys or big files), quiet unless one fails"
quiet = true
run = "prek run --all-files --quiet"

[tasks."web:build"]
description = "The page: type-check web/src (tsc, strict) and bundle it into web/app.js (esbuild). Commit app.js with the sources. Needs npm ci once"
run = """
npx --no-install tsc -p .
npx --no-install esbuild web/src/main.ts --bundle --format=iife --target=es2022 --charset=utf8 --log-level=warning \
  --banner:js='// Generated from web/src (TypeScript) by esbuild: mise run web:build. Do not edit.' --outfile=web/app.js
"""

[tasks."web:check"]
description = "Is web/app.js what web/src makes? web:build, then fail if app.js differs from what git has (staged counts; CI and the commit hook)"
run = """
mise run web:build
if ! git diff --quiet -- web/app.js; then git diff --stat -- web/app.js; echo "web/app.js is out of date: run mise run web:build and commit it"; exit 1; fi
"""

[tasks.gen]
description = "The Go code of the API (gen/) from proto/ with buf, after a change to the .proto (lint first). Commit gen/ with it"
run = "buf lint && buf generate"

[tasks."gen:check"]
description = "Is gen/ what proto/ makes? buf lint, buf generate, then fail if gen/ differs from what git has (staged counts; CI and the commit hook)"
run = '''
buf lint
buf generate
if ! git diff --quiet -- gen || [ -n "$(git ls-files --others --exclude-standard -- gen)" ]; then git status --short -- gen; echo "gen/ is out of date: run mise run gen and commit it"; exit 1; fi
'''

[tasks."test:app"]
description = "go vet + go test for the app, quiet (about 3 s). Args: -- -run Name"
quiet = true
run = "sh scripts/test-app.sh"

[tasks."test:solver"]
description = "The Python tests for the planner, quiet (about 10 s). Args: -- -k name"
dir = "{{config_root}}/solver"
quiet = true
run = "uv run pytest"

[tasks."test:solver:fast"]
description = "Only the rule tests of the planner (about 2 s)"
dir = "{{config_root}}/solver"
quiet = true
run = "uv run pytest tests/test_rules.py"

[tasks."app:build"]
description = "Build the app to bin/dutyplan (one static binary with the frontend embedded)"
quiet = true
run = "go build -o bin/dutyplan ./cmd/dutyplan"

[tasks."app:image"]
description = "Build the container image (server + planner, Dockerfile) as localhost/dutyplan:<commit>, -dirty with uncommitted changes (about 4 min the first time). Prints the name"
quiet = true
run = '''
tag=$(git rev-parse --short=12 HEAD)
git diff --quiet HEAD -- || tag="$tag-dirty"
log=$(mktemp)
podman build -t "localhost/dutyplan:$tag" . >"$log" 2>&1 || { tail -30 "$log"; rm -f "$log"; exit 1; }
rm -f "$log"
echo "image: localhost/dutyplan:$tag"
'''

[tasks.up]
description = "Everything in one command: the Python packages, the build, then the app in the foreground (a new database gets the demo organisation «Test»). Args: -- --addr 127.0.0.1:8080 --db file.db"
depends = ["setup", "app:build"]
quiet = true
run = "sh scripts/up.sh"

[tasks."app:run"]
description = "Run the app in the foreground. Prints one line with the address. Args: -- --addr 127.0.0.1:8080 --db file.db"
quiet = true
run = "go run ./cmd/dutyplan"

[tasks."app:ui"]
description = "Browser check of the frontend in English and Norwegian (headless Chromium against a temporary server, about 20 s). Needs playwright-core from ../scoreboard"
depends = ["app:build"]
quiet = true
run = "node scripts/ui-check.js"

[tasks."app:shots"]
description = "The pictures of the README (docs/img) from the real app on invented data (about 30 s). Needs playwright-core from ../scoreboard; run it again when the page changes visibly"
depends = ["app:build"]
quiet = true
run = "node scripts/shots.js"

[tasks."app:video"]
description = "The film on the start page (web/demo-en.mp4, web/demo-nb.mp4) from the real app on invented data (about 2 min). Args: en | nb. Not in verify or CI; run it again when what the film shows changes visibly"
depends = ["app:build"]
quiet = true
tools = { "conda:ffmpeg" = "9.0.2" }
run = "node scripts/video.js"

[tasks."app:seed"]
description = "Put test data into a running app: the organisation «Test» with the tasks Singing, Sound and Video. Args: -- http://127.0.0.1:8080"
quiet = true
run = "sh scripts/seed-demo.sh"

[tasks."app:smoke"]
description = "Start the app on a temporary database, create two organisations, check the isolation, a planning run, pin, rename and delete with curl, stop it again (about 5 s)"
depends = ["app:build"]
quiet = true
run = "sh scripts/smoke.sh"

[tasks.mutations]
description = "Break every rule in the model and check that a test fails (about 7 min). Quiet on success. Args: --only text, --list"
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python scripts/mutations.py"

[tasks.verify]
description = "Lint + tests (Go + Python) + mutations + smoke test of the app: everything that must be green before a commit"
# The mutations come after the rest, never beside it: the Python ones edit solver/dutyplan_solver/ in place while they run, so a test
# or smoke run against the real planner at the same time would run a broken planner (seen 2026-11-13 as a KeyError from the solver).
depends = ["lint", "test", "app:smoke"]
quiet = true
run = ["mise run mutations", "echo 'verify: ok'"]

[tasks.plan]
description = "Run the planner on the test data and print a short summary (about 6 lines). Args: --full, --info, --time N, --seed N, --input file (a path from the repo root)"
quiet = true
run = "uv run --project solver python solver/scripts/plan.py"

[tasks.check]
description = "Independent check of a finished plan: mise run check -- input.json output.json (paths from the repo root)"
quiet = true
run = "uv run --project solver python -m dutyplan_solver check"

[tasks.solve]
description = "The planner as a filter: mise run solve < input.json > output.json"
quiet = true
run = "uv run --project solver python -m dutyplan_solver"

[tasks.fixture]
description = "Make the test data again (solver/fixtures/autumn2026.json) from make_autumn2026.py"
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python fixtures/make_autumn2026.py > fixtures/autumn2026.json"

[tasks."measure:time"]
description = "Quality against time limit on the test data (about 80 s)"
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python scripts/timing.py"

[tasks."measure:fair"]
description = "Compare weight sets for even distribution (about 100 s). Args: time limit seed..."
quiet = true
dir = "{{config_root}}/solver"
run = "uv run python scripts/fairness_experiment.py"

# Dependencies are also changed through mise. UV_LOCKED=1 (above) forbids it on ordinary runs, so these switch it off.
[tasks.lock]
description = "Update solver/uv.lock after a change in pyproject.toml. Args: --upgrade for newer versions"
quiet = true
dir = "{{config_root}}/solver"
env = { UV_LOCKED = "0" }
run = "uv lock"

[tasks.add]
description = "Add a Python package: mise run add -- package  (or -- --dev package). Updates pyproject.toml and uv.lock"
quiet = true
dir = "{{config_root}}/solver"
env = { UV_LOCKED = "0" }
run = "uv add"
