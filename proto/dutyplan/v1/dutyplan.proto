// ---- plans and their table ----------------------------------------------------------------------------------------

service PlanService {
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  // The slug stays.
  rpc RenamePlan(RenamePlanRequest) returns (RenamePlanResponse);
  // Refused while a run is in progress.
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse);

  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // One event, or a series: every N weeks (at most 8) until a date.
  rpc AddEvents(AddEventsRequest) returns (AddEventsResponse);
  // Copies of an event on dates, or every N weeks until a date; times, details, places and names set by hand as chosen.
  rpc CopyEvent(CopyEventRequest) returns (CopyEventResponse);
  // Change the times; a field left out stays.
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);

  // How many people each task needs on each event.
  rpc ListPlaces(ListPlacesRequest) returns (ListPlacesResponse);
  rpc SetPlaces(SetPlacesRequest) returns (SetPlacesResponse);
  // Back to none.
  rpc ResetPlaces(ResetPlacesRequest) returns (ResetPlacesResponse);
  // Many at once (at most 5000), all or nothing.
  rpc SetPlacesMany(SetPlacesManyRequest) returns (SetPlacesManyResponse);

  // The details rows and their values.
  rpc ListFields(ListFieldsRequest) returns (ListFieldsResponse);
  rpc AddField(AddFieldRequest) returns (AddFieldResponse);
  rpc RenameField(RenameFieldRequest) returns (RenameFieldResponse);
  rpc MoveField(MoveFieldRequest) returns (MoveFieldResponse);
  rpc FreezeField(FreezeFieldRequest) returns (FreezeFieldResponse);
  rpc DeleteField(DeleteFieldRequest) returns (DeleteFieldResponse);
  // "" removes the value.
  rpc SetFieldValue(SetFieldValueRequest) returns (SetFieldValueResponse);

  // Everyone's answers per event, their tasks, and the notes.
  rpc ListAnswers(ListAnswersRequest) returns (ListAnswersResponse);
  // One person's answers (an answer link may do this).
  rpc SetAvailability(SetAvailabilityRequest) returns (SetAvailabilityResponse);
  // A note on an answer, at most 300 characters; "" removes (an answer link may do this).
  rpc SetNote(SetNoteRequest) returns (SetNoteResponse);
  // Many answers at once (at most 5000), all or nothing.
  rpc SetAnswers(SetAnswersRequest) returns (SetAnswersResponse);
}

