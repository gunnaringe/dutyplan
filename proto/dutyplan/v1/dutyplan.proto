message SetNoteResponse {}

message SetAnswersRequest {
  string org = 1;
  string plan = 2;
  repeated Answer answers = 3;
}
message SetAnswersResponse {}

// ---- the planner and the draft ------------------------------------------------------------------------------------

service DraftService {
  // Places set by hand.
  rpc ListCells(ListCellsRequest) returns (ListCellsResponse);
  // A person (or a text) in a place; locked = a planner's name kept.
  rpc AddCell(AddCellRequest) returns (AddCellResponse);
  rpc DeleteCell(DeleteCellRequest) returns (DeleteCellResponse);
  // Selections: only these can be picked.
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
  rpc SetPool(SetPoolRequest) returns (SetPoolResponse);
  // Lock the planner's names so a new draft keeps them, or unlock them (at most 5000; a name set by hand stays).
  rpc SetLocks(SetLocksRequest) returns (SetLocksResponse);
  // Set the drafts aside: only what is set by hand and locked shows, until a new draft or a pin.
  rpc SetDraftAside(SetDraftAsideRequest) returns (SetDraftAsideResponse);
  // Bring the drafts back after that.
  rpc ClearDraftAside(ClearDraftAsideRequest) returns (ClearDraftAsideResponse);

  // What the planner weighs: the specs and what differs from the default.
  rpc GetWeights(GetWeightsRequest) returns (GetWeightsResponse);
  // Replaces them: a key left out goes back to its default, {} resets all.
  rpc SetWeights(SetWeightsRequest) returns (SetWeightsResponse);
  // Make a draft; poll GetRun until its status is done or failed.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // A draft with its places, compromises and load; id 0 = the newest.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // The current plan, what everyone sees.
  rpc PinRun(PinRunRequest) returns (PinRunResponse);
  rpc UnpinRun(UnpinRunRequest) returns (UnpinRunResponse);
}

message ListCellsRequest {
  string org = 1;
  string plan = 2;
}
message ListCellsResponse {
  repeated ManualCell cells = 1;
}

message AddCellRequest {
  string org = 1;
  string plan = 2;
  int32 event = 3;
  int32 task = 4;
  // a person, or 0 with a label
  int32 person = 5;
  string label = 6;
  // places a text fills (default 1)
  int32 fills = 7;
  bool locked = 8;
}
message AddCellResponse {
  ManualCell cell = 1;
}

message DeleteCellRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
}
message DeleteCellResponse {}

message ListPoolsRequest {
  string org = 1;
  string plan = 2;
}
message ListPoolsResponse {
  repeated Pool pools = 1;
}

message SetPoolRequest {
  string org = 1;
  string plan = 2;
  int32 event = 3;
  int32 task = 4;
  repeated int32 people = 5;
}
message SetPoolResponse {}

message SetLocksRequest {
  string org = 1;
  string plan = 2;
  repeated Lock locks = 3;
  bool locked = 4;
}
message SetLocksResponse {}

message SetDraftAsideRequest {
  string org = 1;
  string plan = 2;
}
message SetDraftAsideResponse {}

message ClearDraftAsideRequest {
  string org = 1;
  string plan = 2;
}
message ClearDraftAsideResponse {}

message GetWeightsRequest {
  string org = 1;
  string plan = 2;
}
message GetWeightsResponse {
  repeated WeightSpec specs = 1;
  google.protobuf.Struct values = 2;
}

message SetWeightsRequest {
  string org = 1;
  string plan = 2;
  google.protobuf.Struct values = 3;
}
message SetWeightsResponse {
  repeated WeightSpec specs = 1;
  google.protobuf.Struct values = 2;
}

message StartRunRequest {
  string org = 1;
  string plan = 2;
  // seconds; 0 = the server's default
  int32 time_limit = 3;
}
message StartRunResponse {
  int32 id = 1;
}

message ListRunsRequest {
  string org = 1;
  string plan = 2;
}
message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  string org = 1;
  string plan = 2;
  // 0 = the newest
  int32 id = 3;
  // en | nb: the language of the explanations
  string lang = 4;
}
message GetRunResponse {
  RunInfo run = 1;
  // the columns: every task that has a place in some event
  repeated SnapTask tasks = 2;
  repeated EventRow events = 3;
  // the compromises, in plain words
  repeated string weak = 4;
  repeated LoadRow load = 5;
  repeated string warnings = 6;
}

message PinRunRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
}
message PinRunResponse {}

message UnpinRunRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
}
message UnpinRunResponse {}
