// The API of Tjenesteplan (dutyplan): everything the page does, and nothing more.
//
// Connect over HTTP: POST /dutyplan.v1.<Service>/<Method> with a JSON body (Content-Type: application/json), or binary
// protobuf (application/proto, which the page sends). In JSON, field names on the wire are the ones written here
// (snake_case), every field is sent (also empty ones), ids are numbers, and an unknown field is refused. A field left out
// of a request is empty (0, "", false), except where it says «left out stays». The server also answers gRPC reflection
// (with these comments) where HTTP/2 reaches it.
//
// A request about an organisation names it in `org`, one about a plan also in `plan` (slugs); the server decides
// access from those alone (internal/api/procs.go). Who may call: a member of the organisation, unless the call says
// otherwise. «Admin»: an admin only. «Open»: anyone, signed in or not. «Links read»: a view, answer or edit link to a plan
// may call it too (an edit link reaches its own plan only). «Edit link»: an edit link may make this change too.
// «Answer link»: an answer link (and an edit link) may make it. Somebody else's organisation or plan is 404, as if it
// did not exist. Positions (Move*) count from 0.
//
// Levels are strings, as everywhere on the wire: an answer per event never|poor|good ("" = not answered), a person's
// task poor|good, a combination cannot|practical|standard, a role admin|member, a link view|answer|edit|join.
//
// A refused call is a Connect error; its first detail is a Problem with the kind and the code that the page turns
// into text.
syntax = "proto3";

package dutyplan.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/gunnaringe/dutyplan/gen/dutyplan/v1;dutyplanv1";

// ---- errors -----------------------------------------------------------------------------------------------------

// Problem is the detail of every refused call. error is the kind (not_found, invalid, conflict, busy, unavailable,
// forbidden, signed_out, rate_limited, ...); code and params say precisely what was wrong (err.<code> on the page).
message Problem {
  string error = 1;
  string code = 2;
  google.protobuf.Struct params = 3;
}

// ---- the data -----------------------------------------------------------------------------------------------------

// An organisation: a group with members, tasks, people and plans.
message Org {
  // the address (org in every request), made from the name; it never changes
  string slug = 1;
  string name = 2;
  // RFC 3339
  string created_at = 3;
}

// A plan, for example «Spring 2027»: events, places, answers and drafts.
message Plan {
  // the address (plan in every request); it never changes
  string slug = 1;
  string name = 2;
  string created_at = 3;
  // «Remove unlocked» set the drafts aside: no draft is shown until a new run or a pin.
  bool draft_aside = 4;
}

// The one signed in.
message User {
  string name = 1;
  string email = 2;
}

// A member of an organisation (someone with a login).
message Member {
  int32 id = 1;
  string name = 2;
  string email = 3;
  // admin | member
  string role = 4;
  // the one asking
  bool you = 5;
}

// A share link: to one plan (view, answer, edit) or an invitation (join, no plan).
message Link {
  int32 id = 1;
  string org = 2;
  string org_name = 3;
  string plan = 4;
  string plan_name = 5;
  // view | answer | edit | join
  string level = 6;
  // what it is for, the maker's own words
  string label = 7;
  // the secret part of the link https://<server>/s/<token>
  string token = 8;
  string created_by = 9;
  string created_at = 10;
  // RFC 3339, "" = never
  string expires_at = 11;
  // an invitation for one person: it ends when someone joins with it
  bool single_use = 12;
}

// A job, for example «Sound» or «Coffee»: the organisation's own, the same in every plan, in an order.
message Task {
  int32 id = 1;
  string name = 2;
  // the planner fills it (else only what is set by hand)
  bool planned = 3;
  // a task section, 0 = none
  int32 section = 4;
}

// Two tasks one person may do on the same event; a is the smaller id. No row = impractical («bad»).
message Combination {
  int32 a = 1;
  int32 b = 2;
  // cannot | practical
  string level = 3;
}

// Someone who can be given tasks: a name only, no contact details.
message Person {
  int32 id = 1;
  string name = 2;
  // false: the planner never picks them
  bool proposable = 3;
  // a section, 0 = none
  int32 section = 4;
}

// A heading for people or tasks: placement only.
message Section {
  int32 id = 1;
  string name = 2;
}

// A date of a plan, with an optional time. What is said about it goes in a details row.
message Event {
  int32 id = 1;
  // YYYY-MM-DD
  string date = 2;
  // HH:MM or ""
  string start_time = 3;
  // HH:MM or "" (needs a start time, and comes after it)
  string end_time = 4;
}

// How many people a task needs on an event (no row = none).
message EventPlaces {
  int32 event_id = 1;
  int32 task_id = 2;
  int32 slots = 3;
}

// A details row of the plan («Theme», «Note»): one text per event, for people only.
message PlanField {
  int32 id = 1;
  string name = 2;
  // from 0
  int32 position = 3;
  // stays in sight under the dates
  bool frozen = 4;
}

// The text of a details row for one event.
message FieldValue {
  int32 event_id = 1;
  int32 field_id = 2;
  string value = 3;
}

// A person's answer for an event (no row = not answered).
message EventAnswer {
  int32 person_id = 1;
  int32 event_id = 2;
  // good (gladly) | poor (if needed) | never
  string level = 3;
}

// A task a person takes in the plan (no row = not at all).
message TaskAnswer {
  int32 person_id = 1;
  int32 task_id = 2;
  // good (gladly) | poor (if needed)
  string level = 3;
}

// A person's note on their answer for an event («only before 12»).
message AnswerNote {
  int32 person_id = 1;
  int32 event_id = 2;
  string note = 3;
}

// A place set by hand: a person, or a text that fills some places.
message ManualCell {
  int32 id = 1;
  int32 event_id = 2;
  int32 task_id = 3;
  // the person; not set for a text
  optional int32 person_id = 4;
  // the text, when it is not a person («Youth group»)
  string label = 5;
  // the places a text fills
  int32 fills = 6;
  // a planner's name that was locked (not set by hand)
  bool locked = 7;
}

// Only these people can be picked for a task on an event.
message Pool {
  int32 event_id = 1;
  int32 task_id = 2;
  repeated int32 people = 3;
}

// One answer in a bulk write.
message Answer {
  int32 person = 1;
  int32 event = 2;
  // good | poor | never | "" (not answered)
  string level = 3;
}

// The places of one task on one event in a bulk write.
message Places {
  int32 event = 1;
  int32 task = 2;
  int32 slots = 3;
}

// A planner's name in the draft, to lock or unlock.
message Lock {
  int32 event = 1;
  int32 task = 2;
  int32 person = 3;
}

// One setting of the planner's weighting, and the range it may be set within.
message WeightSpec {
  // w_fair, w_fair_range (an even total load per person), w_task_fair, w_task_range (even per task), w_task.good,
  // w_task.poor, w_date.good, w_date.poor (people's wishes for tasks and dates; the .poor ones are negative),
  // w_combo.practical, w_combo.impractical (two tasks for one person on one event)
  string key = 1;
  double default = 2;
  double min = 3;
  double max = 4;
}

// A run of the planner: a draft.
message Run {
  int32 id = 1;
  // running | done | failed
  string status = 2;
  int32 seed = 3;
  // seconds
  int32 time_limit = 4;
  // why it failed
  string error = 5;
  string started_at = 6;
  string finished_at = 7;
  // the plan's current plan (at most one per plan)
  bool pinned = 8;
}

// A run with what the view adds.
message RunInfo {
  int32 id = 1;
  string status = 2;
  int32 seed = 3;
  int32 time_limit = 4;
  string error = 5;
  string started_at = 6;
  string finished_at = 7;
  bool pinned = 8;
  // the plan's data has changed since this run
  bool stale = 9;
  // OPTIMAL | FEASIBLE
  string solver_status = 10;
  double wall_time = 11;
  // the independent checker has looked at the plan
  bool checked = 12;
  // what the checker found wrong (empty when all is well)
  repeated string violations = 13;
}

// A task as it was when the run was made.
message SnapTask {
  int32 id = 1;
  string name = 2;
  bool planned = 3;
}

// A person in a place of the draft.
message CellPerson {
  int32 id = 1;
  string name = 2;
  // given against a «poor»
  bool weak = 3;
  // set by hand or locked when the run was made
  bool locked = 4;
  // of those, one of the planner's names that was locked
  bool kept = 5;
}

// A text set by hand in a place of the draft («Youth group»).
message CellText {
  string text = 1;
  // the places it fills
  int32 fills = 2;
}

// One task on one event in the draft.
message Cell {
  int32 task_id = 1;
  // the places: filled + missing (more than the event's places when more were set by hand)
  int32 slots = 2;
  repeated CellPerson people = 3;
  repeated CellText texts = 4;
  // places nobody could fill
  int32 missing = 5;
  // why places are missing, in plain words (in the language asked for)
  string explanation = 6;
}

// An event in the draft.
message EventRow {
  int32 id = 1;
  string date = 2;
  // the event's time now while it exists, else the one from when the run was made
  string start_time = 3;
  string end_time = 4;
  // in the order of the run's tasks; a task with nothing in this event is left out
  repeated Cell cells = 5;
}

// How much one person was given in the draft.
message LoadRow {
  int32 person_id = 1;
  string name = 2;
  // the places they were given
  int32 count = 3;
  // their fair share
  double target = 4;
}

// ---- the server and you -------------------------------------------------------------------------------------------

// What needs no organisation: the server, who you are, the organisations you reach.
service AccountService {
  // Is the server up, and can it plan (is the solver there)? Open.
  rpc Health(HealthRequest) returns (HealthResponse);
  // Whether there is a login, who is signed in, and the share links open in this browser. Open.
  rpc Me(MeRequest) returns (MeResponse);
  // The organisations you reach (as a member, or through a link).
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  // Make an organisation; you become its admin. Its slug comes from the name (a taken one gets -2, -3, ...). Signed in.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  // false: drafts cannot be made here (StartRun answers unavailable)
  bool planner = 2;
}

message MeRequest {}
message MeResponse {
  // the server has a login (false: everyone who reaches it may do everything)
  bool login = 1;
  // null when nobody is signed in
  User user = 2;
  repeated Link links = 3;
  // where to make an account, if the server says
  string signup = 4;
}

message ListOrgsRequest {}
message ListOrgsResponse {
  repeated Org orgs = 1;
}

message CreateOrgRequest {
  string name = 1;
}
message CreateOrgResponse {
  Org org = 1;
}

// ---- the organisation, members and links --------------------------------------------------------------------------

// The organisation itself, its members and its share links. Members only, unless a call says otherwise.
service OrgService {
  // The organisation, with what you may do: your role, or a link's level and plan. Links read.
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  // Rename (admin). The slug stays.
  rpc RenameOrg(RenameOrgRequest) returns (RenameOrgResponse);
  // Delete an organisation that has no plans left (admin); confirm is its slug again. It cannot be undone.
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);
  // Members with a login.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // Change a member's role (admin).
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);
  // Remove a member (admin), or leave (yourself).
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // The share links and invitations.
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);
  // Make a link to a plan (view | answer | edit), or an invitation to become a member (join: admin, no plan).
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse);
  // Delete a link (an invitation: admin).
  rpc DeleteLink(DeleteLinkRequest) returns (DeleteLinkResponse);
}

message GetOrgRequest {
  string org = 1;
}
message GetOrgResponse {
  string slug = 1;
  string name = 2;
  string created_at = 3;
  // admin | member; "" when you come through a link
  string role = 4;
  // the link's level (view | answer | edit); "" for a member
  string level = 5;
  // the plan the link is to; "" for a member
  string plan = 6;
}

message RenameOrgRequest {
  string org = 1;
  string name = 2;
}
message RenameOrgResponse {
  Org org = 1;
}

message DeleteOrgRequest {
  string org = 1;
  // the slug again, so a stray call cannot delete
  string confirm = 2;
}
message DeleteOrgResponse {}

message ListMembersRequest {
  string org = 1;
}
message ListMembersResponse {
  repeated Member members = 1;
}

message SetMemberRoleRequest {
  string org = 1;
  // the member's id
  int32 id = 2;
  // admin | member
  string role = 3;
}
message SetMemberRoleResponse {}

message RemoveMemberRequest {
  string org = 1;
  // the member's id (your own to leave)
  int32 id = 2;
}
message RemoveMemberResponse {}

message ListLinksRequest {
  string org = 1;
}
message ListLinksResponse {
  repeated Link links = 1;
}

message CreateLinkRequest {
  string org = 1;
  // the plan the link is to ("" for an invitation)
  string plan = 2;
  // view (read) | answer (read, and set anyone's answers and notes) | edit (change the plan) | join (an invitation)
  string level = 3;
  // what it is for, to tell links apart
  string label = 4;
  // it runs out after 1 to 366 days; 0 = never
  int32 expires_days = 5;
  // an invitation only: it ends when someone joins with it
  bool single_use = 6;
}
message CreateLinkResponse {
  Link link = 1;
}

message DeleteLinkRequest {
  string org = 1;
  int32 id = 2;
}
message DeleteLinkResponse {}

// ---- tasks, people and sections (each plan's own) ------------------------------------------------------------------

// A plan's tasks, people and sections: every plan has its own. Every call: members; a link to the plan reads, an edit
// link writes.
service SetupService {
  // The tasks, in their order.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // Add a task; it goes last (in its section).
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  // Rename, or turn the planner on or off for it; a field left out stays.
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  // Delete a task, with its places and the people's answers about it; refused (conflict) while a cell set by hand or a
  // selection uses it.
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  // Move a task; section left out = the one it is in.
  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse);
  // Which pairs of tasks one person can do on the same event (pairs not listed: impractical).
  rpc ListCombinations(ListCombinationsRequest) returns (ListCombinationsResponse);
  // Set a pair: cannot | practical | standard (standard removes it: impractical, the planner's default).
  rpc SetCombination(SetCombinationRequest) returns (SetCombinationResponse);
  // Set one task against all others, the same levels.
  rpc SetTaskCombinations(SetTaskCombinationsRequest) returns (SetTaskCombinationsResponse);

  // The people, in their order.
  rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse);
  // Add a person (a name only); they go last (in their section).
  rpc CreatePerson(CreatePersonRequest) returns (CreatePersonResponse);
  // Rename, or whether the planner may propose them; a field left out stays.
  rpc UpdatePerson(UpdatePersonRequest) returns (UpdatePersonResponse);
  // Move a person, into a section or out of one.
  rpc MovePerson(MovePersonRequest) returns (MovePersonResponse);

  // Sections of people: headings, placement only.
  rpc ListSections(ListSectionsRequest) returns (ListSectionsResponse);
  // Add a section of people.
  rpc CreateSection(CreateSectionRequest) returns (CreateSectionResponse);
  // Rename a section of people.
  rpc RenameSection(RenameSectionRequest) returns (RenameSectionResponse);
  // Move a section of people.
  rpc MoveSection(MoveSectionRequest) returns (MoveSectionResponse);
  // Delete a section of people; the people stay, without a section.
  rpc DeleteSection(DeleteSectionRequest) returns (DeleteSectionResponse);

  // Sections of tasks: headings, placement only (tasks without one come first).
  rpc ListTaskSections(ListTaskSectionsRequest) returns (ListTaskSectionsResponse);
  // Add a section of tasks.
  rpc CreateTaskSection(CreateTaskSectionRequest) returns (CreateTaskSectionResponse);
  // Rename a section of tasks.
  rpc RenameTaskSection(RenameTaskSectionRequest) returns (RenameTaskSectionResponse);
  // Move a section of tasks.
  rpc MoveTaskSection(MoveTaskSectionRequest) returns (MoveTaskSectionResponse);
  // Delete a section of tasks; the tasks stay, without a section.
  rpc DeleteTaskSection(DeleteTaskSectionRequest) returns (DeleteTaskSectionResponse);
}

message ListTasksRequest {
  string org = 1;
  string plan = 2;
}
message ListTasksResponse {
  repeated Task tasks = 1;
}

message CreateTaskRequest {
  string org = 1;
  string plan = 2;
  string name = 3;
  // a task section to add it to (0 = none)
  int32 section = 4;
}
message CreateTaskResponse {
  Task task = 1;
}

message UpdateTaskRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  optional string name = 4;
  // false: the planner leaves it alone (only what is set by hand)
  optional bool planned = 5;
}
message UpdateTaskResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
}
message DeleteTaskResponse {}

message MoveTaskRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  // required
  optional int32 position = 4;
  // 0 = none; left out = the section it is in
  optional int32 section = 5;
}
message MoveTaskResponse {}

message ListCombinationsRequest {
  string org = 1;
  string plan = 2;
}
message ListCombinationsResponse {
  repeated Combination combinations = 1;
}

message SetCombinationRequest {
  string org = 1;
  string plan = 2;
  // two task ids, in either order
  int32 a = 3;
  int32 b = 4;
  // cannot | practical | standard
  string level = 5;
}
message SetCombinationResponse {}

message SetTaskCombinationsRequest {
  string org = 1;
  string plan = 2;
  int32 task = 3;
  // cannot | practical | standard
  string level = 4;
}
message SetTaskCombinationsResponse {}

message ListPeopleRequest {
  string org = 1;
  string plan = 2;
}
message ListPeopleResponse {
  repeated Person people = 1;
}

message CreatePersonRequest {
  string org = 1;
  string plan = 2;
  string name = 3;
  // 0 = none
  int32 section = 4;
}
message CreatePersonResponse {
  Person person = 1;
}

message UpdatePersonRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  optional string name = 4;
  // false: the planner never picks them
  optional bool proposable = 5;
}
message UpdatePersonResponse {
  Person person = 1;
}

message MovePersonRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  // required
  optional int32 position = 4;
  // 0 = none
  int32 section = 5;
}
message MovePersonResponse {}

message ListSectionsRequest {
  string org = 1;
  string plan = 2;
}
message ListSectionsResponse {
  repeated Section sections = 1;
}

message CreateSectionRequest {
  string org = 1;
  string plan = 2;
  string name = 3;
}
message CreateSectionResponse {
  Section section = 1;
}

message RenameSectionRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  string name = 4;
}
message RenameSectionResponse {
  Section section = 1;
}

message MoveSectionRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  // required
  optional int32 position = 4;
}
message MoveSectionResponse {}

message DeleteSectionRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
}
message DeleteSectionResponse {}

message ListTaskSectionsRequest {
  string org = 1;
  string plan = 2;
}
message ListTaskSectionsResponse {
  repeated Section sections = 1;
}

message CreateTaskSectionRequest {
  string org = 1;
  string plan = 2;
  string name = 3;
}
message CreateTaskSectionResponse {
  Section section = 1;
}

message RenameTaskSectionRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  string name = 4;
}
message RenameTaskSectionResponse {
  Section section = 1;
}

message MoveTaskSectionRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
  // required
  optional int32 position = 4;
}
message MoveTaskSectionResponse {}

message DeleteTaskSectionRequest {
  string org = 1;
  string plan = 2;
  int32 id = 3;
}
message DeleteTaskSectionResponse {}

// ---- plans and their table ----------------------------------------------------------------------------------------

// Plans, and what is in one: events, places, details rows and everyone's answers. Every call from GetPlan on: links read,
// edit link (an edit link: its own plan only).
service PlanService {
  // The organisation's plans. Members only.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  // Make a plan; its slug comes from the name. It starts empty, or with the people and tasks of another plan (their
  // sections, ⚡, combinations and the tasks people take). Members only.
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  // A copy of a plan under a new name: its people and tasks, and with `table` its events, details, places, names set by
  // hand, selections, answers, notes and weights. Drafts and links are never copied. Members only.
  rpc DuplicatePlan(DuplicatePlanRequest) returns (DuplicatePlanResponse);
  // One plan.
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  // Rename a plan; the slug stays.
  rpc RenamePlan(RenamePlanRequest) returns (RenamePlanResponse);
  // Delete a plan with everything in it. Refused while a run is in progress. It cannot be undone.
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse);

  // The events, in date and time order.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // One event, or a series: every N weeks (at most 8) until a date.
  rpc AddEvents(AddEventsRequest) returns (AddEventsResponse);
  // Copies of an event on dates, or every N weeks until a date; times, details, places and names set by hand as chosen.
  rpc CopyEvent(CopyEventRequest) returns (CopyEventResponse);
  // Change the times; a field left out stays.
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  // Delete an event with its places, details, answers and cells.
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);

  // How many people each task needs on each event.
  rpc ListPlaces(ListPlacesRequest) returns (ListPlacesResponse);
  // Set how many people a task needs on an event (0 = not needed).
  rpc SetPlaces(SetPlacesRequest) returns (SetPlacesResponse);
  // Back to none.
  rpc ResetPlaces(ResetPlacesRequest) returns (ResetPlacesResponse);
  // Many at once (at most 5000), all or nothing.
  rpc SetPlacesMany(SetPlacesManyRequest) returns (SetPlacesManyResponse);

  // The details rows («Theme», «Note»: one text per event) and their values.
  rpc ListFields(ListFieldsRequest) returns (ListFieldsResponse);
  // Add a details row; it goes last.
  rpc AddField(AddFieldRequest) returns (AddFieldResponse);
  // Rename a details row.
  rpc RenameField(RenameFieldRequest) returns (RenameFieldResponse);
  // Move a details row.
  rpc MoveField(MoveFieldRequest) returns (MoveFieldResponse);
  // Freeze a details row (it stays in sight under the dates), or unfreeze it.
  rpc FreezeField(FreezeFieldRequest) returns (FreezeFieldResponse);
  // Delete a details row with its values.
  rpc DeleteField(DeleteFieldRequest) returns (DeleteFieldResponse);
  // The text of a details row for one event; "" removes it.
  rpc SetFieldValue(SetFieldValueRequest) returns (SetFieldValueResponse);

  // Everyone's answers per event, the tasks each person takes in this plan, and the notes.
  rpc ListAnswers(ListAnswersRequest) returns (ListAnswersResponse);
  // A person takes a task in this plan: good (gladly) | poor (if needed). Each plan has its own; a new plan starts with a copy
  // of the newest plan's. Answer link.
  rpc SetPersonTask(SetPersonTaskRequest) returns (SetPersonTaskResponse);
  // A person no longer takes a task in this plan. Answer link.
  rpc RemovePersonTask(RemovePersonTaskRequest) returns (RemovePersonTaskResponse);
  // One person's answers for some events. Answer link.
  rpc SetAvailability(SetAvailabilityRequest) returns (SetAvailabilityResponse);
  // A note on an answer, at most 300 characters; "" removes it. Answer link.
  rpc SetNote(SetNoteRequest) returns (SetNoteResponse);
  // Many answers at once (at most 5000), all or nothing.
  rpc SetAnswers(SetAnswersRequest) returns (SetAnswersResponse);
}

message ListPlansRequest {
  string org = 1;
}
message ListPlansResponse {
  repeated Plan plans = 1;
}

message CreatePlanRequest {
  string org = 1;
  string name = 2;
  // the slug of a plan of the organisation to start with the people and tasks of; empty: start empty
